name: Bootstrap portable Android toolchain

on:
  push:
    branches:
      - tooling/android-sdk-bootstrap

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools/latest"
          curl -fL --retry 3 -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/cmdline-tools-extract"
          mv "$RUNNER_TEMP/cmdline-tools-extract/cmdline-tools/"* "$SDK/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "emulator" \
            "system-images;android-37;google_apis;x86_64"

      - name: Download Gradle 9.8.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/gradle-9.8.0-bin.zip \
            https://services.gradle.org/distributions/gradle-9.8.0-bin.zip

      - name: Package toolchain
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$ANDROID_SDK_ROOT"
          tar -C "$SDK" -czf /tmp/android-sdk-core.tar.gz \
            cmdline-tools platform-tools platforms build-tools licenses
          tar -C "$SDK" -czf /tmp/android-sdk-native.tar.gz ndk cmake
          tar -C "$SDK" -czf /tmp/android-sdk-emulator.tar.gz emulator system-images
          tar -C "$(dirname "$JAVA_HOME")" -czf /tmp/jdk17.tar.gz "$(basename "$JAVA_HOME")"
          sha256sum \
            /tmp/android-sdk-core.tar.gz \
            /tmp/android-sdk-native.tar.gz \
            /tmp/android-sdk-emulator.tar.gz \
            /tmp/jdk17.tar.gz \
            /tmp/gradle-9.8.0-bin.zip > /tmp/SHA256SUMS
          du -h /tmp/android-sdk-*.tar.gz /tmp/jdk17.tar.gz /tmp/gradle-9.8.0-bin.zip

      - name: Upload Android SDK core
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-core
          path: |
            /tmp/android-sdk-core.tar.gz
            /tmp/SHA256SUMS
          compression-level: 0
          retention-days: 1

      - name: Upload Android native toolchain
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-native
          path: /tmp/android-sdk-native.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload Android emulator toolchain
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-emulator
          path: /tmp/android-sdk-emulator.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: android-jdk17
          path: /tmp/jdk17.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Upload Gradle
        uses: actions/upload-artifact@v4
        with:
          name: gradle-9.8.0
          path: /tmp/gradle-9.8.0-bin.zip
          compression-level: 0
          retention-days: 1
