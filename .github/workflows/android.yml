name: Verify Android companion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, lint and test debug variant
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Generate disposable release-verification key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/garma-ci.jks" -storetype JKS -alias ci-verification -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Garma CI Verification Only' -storepass ci-verification-only -keypass ci-verification-only -noprompt
      - name: Verify release APK and App Bundle
        working-directory: android
        env:
          GARMA_ANDROID_KEYSTORE: ${{ runner.temp }}/garma-ci.jks
          GARMA_ANDROID_STORE_PASSWORD: ci-verification-only
          GARMA_ANDROID_KEY_ALIAS: ci-verification
          GARMA_ANDROID_KEY_PASSWORD: ci-verification-only
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease :app:lintRelease :app:testReleaseUnitTest
      - name: Require passing tests and a non-debuggable signed release APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/release-badging.txt"
          if grep -q 'application-debuggable' "$RUNNER_TEMP/release-badging.txt"; then
            echo '::error::The release package must not be debuggable.'
            exit 1
          fi
          test -s android/app/build/outputs/bundle/release/app-release.aab
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          report = {'scope': 'Native JVM tests, lint and debug/release compilation. Release signing uses a disposable CI-only key; no installable production release is published.', 'variants': {}}
          for variant in ['Debug', 'Release']:
              paths = pathlib.Path(f'android/app/build/test-results/test{variant}UnitTest').glob('TEST-*.xml')
              cases = [c for p in paths for c in ET.parse(p).getroot().iter('testcase')]
              assert len(cases) >= 12, f'{variant}: missing native test cases'
              assert not any(c.find(tag) is not None for c in cases for tag in ['failure', 'error', 'skipped']), f'{variant}: failed/skipped tests'
              lint = ET.parse(f'android/app/build/reports/lint-results-{variant.lower()}.xml').getroot()
              issues = list(lint.iter('issue'))
              assert not any(i.get('severity') in ['Error', 'Fatal'] for i in issues), f'{variant}: lint errors'
              report['variants'][variant.lower()] = {'tests': len(cases), 'lintErrors': 0, 'lintWarnings': sum(i.get('severity') == 'Warning' for i in issues)}
          pathlib.Path('android/app/build/reports/native-verification.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Remove disposable signing material and test-signed release packages
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/garma-ci.jks"
          rm -rf android/app/build/outputs/apk/release android/app/build/outputs/bundle/release
      - name: Upload debug-only build and verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
          if-no-files-found: error
