name: ChatGPT Android Toolchain Transfer Split

on:
  push:
    branches:
      - chatgpt/android-sdk-bootstrap-20260928

permissions:
  contents: read
  actions: read

jobs:
  split-toolchain-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download validated toolchain artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/source/native" "$RUNNER_TEMP/source/emulator" "$RUNNER_TEMP/chunks"
          gh run download 36465817518 --name android-native --dir "$RUNNER_TEMP/source/native"
          gh run download 36465817518 --name android-emulator --dir "$RUNNER_TEMP/source/emulator"
          ls -lh "$RUNNER_TEMP/source/native" "$RUNNER_TEMP/source/emulator"

      - name: Split large archives and package real JDK 17
        shell: bash
        run: |
          set -euxo pipefail
          CHUNKS="$RUNNER_TEMP/chunks"
          split -b 400M -d -a 2 "$RUNNER_TEMP/source/native/android-native.tar.gz" "$CHUNKS/android-native.part-"
          split -b 400M -d -a 2 "$RUNNER_TEMP/source/emulator/android-emulator.tar.gz" "$CHUNKS/android-emulator.part-"

          JAVA_REAL="$(readlink -f "$JAVA_HOME")"
          tar -C "$(dirname "$JAVA_REAL")" -czf "$CHUNKS/jdk17-real.tar.gz" "$(basename "$JAVA_REAL")"

          sha256sum "$CHUNKS"/* > "$CHUNKS/SHA256SUMS"
          ls -lh "$CHUNKS"

      - name: Upload native part 00
        uses: actions/upload-artifact@v4
        with: { name: android-native-part-00, path: "${{ runner.temp }}/chunks/android-native.part-00", compression-level: 0, if-no-files-found: ignore }
      - name: Upload native part 01
        uses: actions/upload-artifact@v4
        with: { name: android-native-part-01, path: "${{ runner.temp }}/chunks/android-native.part-01", compression-level: 0, if-no-files-found: ignore }
      - name: Upload native part 02
        uses: actions/upload-artifact@v4
        with: { name: android-native-part-02, path: "${{ runner.temp }}/chunks/android-native.part-02", compression-level: 0, if-no-files-found: ignore }
      - name: Upload native part 03
        uses: actions/upload-artifact@v4
        with: { name: android-native-part-03, path: "${{ runner.temp }}/chunks/android-native.part-03", compression-level: 0, if-no-files-found: ignore }

      - name: Upload emulator part 00
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-00, path: "${{ runner.temp }}/chunks/android-emulator.part-00", compression-level: 0, if-no-files-found: ignore }
      - name: Upload emulator part 01
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-01, path: "${{ runner.temp }}/chunks/android-emulator.part-01", compression-level: 0, if-no-files-found: ignore }
      - name: Upload emulator part 02
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-02, path: "${{ runner.temp }}/chunks/android-emulator.part-02", compression-level: 0, if-no-files-found: ignore }
      - name: Upload emulator part 03
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-03, path: "${{ runner.temp }}/chunks/android-emulator.part-03", compression-level: 0, if-no-files-found: ignore }
      - name: Upload emulator part 04
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-04, path: "${{ runner.temp }}/chunks/android-emulator.part-04", compression-level: 0, if-no-files-found: ignore }
      - name: Upload emulator part 05
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-05, path: "${{ runner.temp }}/chunks/android-emulator.part-05", compression-level: 0, if-no-files-found: ignore }
      - name: Upload emulator part 06
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-06, path: "${{ runner.temp }}/chunks/android-emulator.part-06", compression-level: 0, if-no-files-found: ignore }
      - name: Upload emulator part 07
        uses: actions/upload-artifact@v4
        with: { name: android-emulator-part-07, path: "${{ runner.temp }}/chunks/android-emulator.part-07", compression-level: 0, if-no-files-found: ignore }

      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: jdk17-real
          path: ${{ runner.temp }}/chunks/jdk17-real.tar.gz
          compression-level: 0

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: android-transfer-checksums
          path: ${{ runner.temp }}/chunks/SHA256SUMS
