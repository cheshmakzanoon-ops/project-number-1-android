name: ChatGPT Android System Image Raw Transfer

on:
  push:
    branches:
      - chatgpt/android-sdk-bootstrap-20260928

permissions:
  contents: read
  actions: read

jobs:
  repack-system-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download validated emulator artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/chunks"
          gh run download 36465817518 --name android-emulator --dir "$RUNNER_TEMP/source"
          tar -xzf "$RUNNER_TEMP/source/android-emulator.tar.gz" -C "$RUNNER_TEMP/unpacked"
          du -sh "$RUNNER_TEMP/unpacked/system-images"
          find "$RUNNER_TEMP/unpacked/system-images" -maxdepth 5 -type f -printf '%p %s\n' | sort

      - name: Create sparse raw tar chunks
        shell: bash
        run: |
          set -euxo pipefail
          tar --sparse -cf "$RUNNER_TEMP/system-images.raw.tar" -C "$RUNNER_TEMP/unpacked" system-images
          sha256sum "$RUNNER_TEMP/system-images.raw.tar" > "$RUNNER_TEMP/chunks/SHA256SUMS"
          stat -c '%n %s bytes' "$RUNNER_TEMP/system-images.raw.tar" >> "$RUNNER_TEMP/chunks/SHA256SUMS"
          split -b 350M -d -a 2 "$RUNNER_TEMP/system-images.raw.tar" "$RUNNER_TEMP/chunks/system-images.raw.part-"
          ls -lh "$RUNNER_TEMP/chunks"

      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-00, path: "${{ runner.temp }}/chunks/system-images.raw.part-00", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-01, path: "${{ runner.temp }}/chunks/system-images.raw.part-01", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-02, path: "${{ runner.temp }}/chunks/system-images.raw.part-02", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-03, path: "${{ runner.temp }}/chunks/system-images.raw.part-03", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-04, path: "${{ runner.temp }}/chunks/system-images.raw.part-04", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-05, path: "${{ runner.temp }}/chunks/system-images.raw.part-05", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 06
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-06, path: "${{ runner.temp }}/chunks/system-images.raw.part-06", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 07
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-07, path: "${{ runner.temp }}/chunks/system-images.raw.part-07", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 08
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-08, path: "${{ runner.temp }}/chunks/system-images.raw.part-08", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 09
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-09, path: "${{ runner.temp }}/chunks/system-images.raw.part-09", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 10
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-10, path: "${{ runner.temp }}/chunks/system-images.raw.part-10", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 11
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-11, path: "${{ runner.temp }}/chunks/system-images.raw.part-11", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 12
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-12, path: "${{ runner.temp }}/chunks/system-images.raw.part-12", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 13
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-13, path: "${{ runner.temp }}/chunks/system-images.raw.part-13", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 14
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-14, path: "${{ runner.temp }}/chunks/system-images.raw.part-14", compression-level: 0, if-no-files-found: ignore }
      - name: Upload part 15
        uses: actions/upload-artifact@v4
        with: { name: android-system-raw-15, path: "${{ runner.temp }}/chunks/system-images.raw.part-15", compression-level: 0, if-no-files-found: ignore }

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: android-system-raw-manifest
          path: ${{ runner.temp }}/chunks/SHA256SUMS
