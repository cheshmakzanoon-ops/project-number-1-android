name: Apply tested draft and lifecycle repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-final-ownership.yml']
permissions:
  contents: write
concurrency:
  group: apply-final-ownership
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply reviewed application-only patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/8d551e19302a2df2be1823d99461ca8fc93ae08a" --jq .content | base64 --decode > "$RUNNER_TEMP/repair.xz"
          python3 - <<'PY'
          import pathlib, os, lzma, hashlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = lzma.decompress((root / 'repair.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'eb09a87d5b6f520b596a5ac7a1790d655c009e94d7f15335d6729280ec6dd46e'
          (root / 'repair.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/repair.patch"
          git apply --index "$RUNNER_TEMP/repair.patch"
          git diff --cached --check
          if git diff --cached --name-only | grep -qv '^src/'; then exit 1; fi
      - run: bun install --frozen-lockfile
      - run: bun run test:call-video --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - run: bun run typecheck
      - run: bun run build
      - name: Commit and push tested application files without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve drafts and bound stale navigation and call startup' -m 'Preserve compose text across attachment cancellation and editing, serialize image preparation, pin ambiguous media retries to their original payload, and invalidate stale contact intents. Bound registration, SDK loading and playback unlock without allowing late callbacks to resurrect calls. Add 21 regression cases; 299 tests, types and production build pass before push.'
          git push origin HEAD:main
          git rev-parse HEAD > verified-commit.txt
          git archive --format=tar HEAD | gzip > source.tar.gz
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: draft-lifecycle-${{ github.run_id }}
          path: |
            test-results.xml
            verified-commit.txt
            source.tar.gz
          retention-days: 7
