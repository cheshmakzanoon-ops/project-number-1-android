name: Apply tested status and audio-call repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-final-ownership.yml']
permissions:
  contents: write
concurrency:
  group: apply-final-ownership
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Apply reviewed application-only patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/ec1f2f14e690a5a5b1b47c8f56bc3015b6944533" --jq .content | base64 --decode > "$RUNNER_TEMP/repair.xz"
          python3 - <<'PY'
          import pathlib, os, lzma, hashlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = lzma.decompress((root / 'repair.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'dcfc209a6f9b3cae2c64e33643441f02115af83b22244ca5ee432bdb2bf22907'
          (root / 'repair.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/repair.patch"
          git apply --index "$RUNNER_TEMP/repair.patch"
          git diff --cached --check
          if git diff --cached --name-only | grep -qv '^src/'; then exit 1; fi
      - run: bun install --frozen-lockfile
      - run: bun run test:call-video --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - run: bun run typecheck
      - run: bun run build
      - name: Commit and push tested application files without force
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: add direct audio calling and make status operations lifecycle-safe' -m 'Offer audio-only calls from direct chats, releasing the voice recorder first. Bound status posting, image preparation, authorization and deletion; ignore stale identity/viewer continuations, preserve failed drafts, correct image-caption limits, and pause hidden stories. Reject unauthorized deletion rather than reporting false success. All 312 regressions, types and production build pass before push.'
          git push origin HEAD:main
          git rev-parse HEAD > verified-commit.txt
          git archive --format=tar HEAD | gzip > source.tar.gz
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: status-audio-${{ github.run_id }}
          path: |
            test-results.xml
            verified-commit.txt
            source.tar.gz
          retention-days: 7
