name: Check deployed backend

on:
  workflow_dispatch:
    inputs:
      frontend_origin:
        description: 'Exact HTTPS frontend origin; defaults to repository variable GARMA_FRONTEND_ORIGIN'
        required: false
        type: string

permissions:
  contents: read

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical deployment without modifying user data
        env:
          GARMA_FRONTEND_ORIGIN: ${{ inputs.frontend_origin || vars.GARMA_FRONTEND_ORIGIN }}
        run: node scripts/check-backend-readiness.mjs
      - name: Preserve sanitized readiness report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-readiness-${{ github.sha }}-${{ github.run_attempt }}
          path: backend-readiness.json
          retention-days: 7
          if-no-files-found: error
