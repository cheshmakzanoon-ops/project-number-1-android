name: Verify message menu repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-message-menu.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - name: Apply reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/c087218f999d275bbca021b30a905038d1eb10c9" --jq .content | base64 --decode > "$RUNNER_TEMP/menu.xz"
          python3 - <<'PY'
          import pathlib, hashlib, lzma, os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          data=lzma.decompress((root/'menu.xz').read_bytes())
          assert hashlib.sha256(data).hexdigest()=='f437525a22171a563bf7c35b9533222c5a74d012470808207c9909db071cde33'
          (root/'menu.patch').write_bytes(data)
          PY
          git apply --check --index "$RUNNER_TEMP/menu.patch"
          git apply --index "$RUNNER_TEMP/menu.patch"
          git diff --cached --check
      - run: bun install --frozen-lockfile
      - run: bun run test:call-video --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - run: bun run typecheck && bun run build
      - name: Push tested application code
        run: |
          set -euo pipefail
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep message actions above their backdrop and outside image clipping' -m 'Portal the message toolbar outside transformed chat bubbles; clamp to viewport, support keyboard navigation and preserve composer focus. Add three regressions for action, focus and teardown behavior.'
          git push origin HEAD:main
          git rev-parse HEAD > verified-commit.txt
          git archive --format=tar HEAD | gzip > source.tar.gz
      - name: Verify actual browser interactions
        run: GITHUB_SHA="$(git rev-parse HEAD)" bash scripts/e2e/run-isolated.sh
      - name: Save test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: message-menu-verification-${{ github.run_id }}
          path: |
            verified-commit.txt
            source.tar.gz
            test-results.xml
            e2e-results/
            src/convex/_generated/
          retention-days: 7
