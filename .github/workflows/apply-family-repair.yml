name: Verify and apply family reliability repair

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-family-repair.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-family-repair
  cancel-in-progress: false

jobs:
  verify-and-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve integrity-checked reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/repair.xz"
          for SHA in d726514e42c6dc98fa85be4f147258da0be91641 83803a45bd2131deb646f7faf82c10257d8ce91d 50d31cb0aa4a93186217e23ba3f306d3aa9a87ef; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$SHA" --jq .content | base64 --decode >> "$RUNNER_TEMP/repair.xz"
          done
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          patch = lzma.decompress((root / 'repair.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == 'f4db83cc331345afe93e9a47d8e192cab2fbc603c71af44f51595d3e85a80015', 'Patch integrity failure'
          (root / 'reviewed.patch').write_bytes(patch)
          PY
          git apply --check --index "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          git diff --cached --check
      - uses: oven-sh/setup-bun@v2
      - name: Install locked web dependencies
        run: bun install --frozen-lockfile
      - name: Web and backend regressions
        run: bun run test:call-video --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - name: Typecheck and build production frontend
        run: |
          bun run typecheck
          bun run build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, lint and test Android companion
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Require actual passing test cases, not empty tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          def require_cases(paths, minimum, label):
              cases = [case for path in paths for case in ET.parse(path).getroot().iter('testcase')]
              assert len(cases) >= minimum, f'{label}: expected at least {minimum} tests, got {len(cases)}'
              assert not any(case.find(tag) is not None for case in cases for tag in ['failure', 'error', 'skipped']), f'{label}: failed or skipped case'
              print(f'{label}: {len(cases)} actual passing tests')
          require_cases([Path('test-results.xml')], 144, 'Web/backend')
          require_cases(Path('android/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'), 5, 'Android')
          assert Path('android/app/build/outputs/apk/debug/app-debug.apk').is_file(), 'No APK generated'
          PY
      - name: Commit verified changes and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-family-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve queued messages, read receipts, shared media and native capture lifecycle' -m 'Keep active call controls during backend recovery; isolate durable multi-tab outboxes; scope read receipts to displayed messages; preserve shared uploads until their last reference is removed. Bound Android capture authorization and cancel startup/cleanup safely. Verified 144 web/backend regressions, production types/build, and Android assemble/lint/unit tests before commit. Add a guarded manual backend deployment workflow; no production deployment or physical-device acceptance is implied.'
          git push origin HEAD:main
          git rev-parse HEAD > verified-commit.txt
          git archive --format=tar HEAD | gzip > source.tar.gz
          printf '\nVerified and pushed commit: %s\n' "$(cat verified-commit.txt)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verification evidence and debug-only APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: family-repair-verification-${{ github.run_id }}
          path: |
            verified-commit.txt
            source.tar.gz
            test-results.xml
            dist/
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7
          if-no-files-found: warn
